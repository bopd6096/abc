<!-- public/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product List</title>
    <style>
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            padding: 20px;
        }
        .product-card {
            border: 1px solid #ddd;
            padding: 15px;
            text-align: center;
        }
        .product-card img {
            max-width: 100%;
            height: auto;
        }
        #load-more {
            display: block;
            margin: 20px auto;
            padding: 10px 20px;
        }
        .error-message {
            color: red;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="product-grid" id="product-grid"></div>
    <button id="load-more">Load More</button>
    <div id="error-message" class="error-message"></div>

    <script>
        let currentPage = 1;
        let totalPages = 1;
        const limit = 10;

        async function loadProducts(page) {
            try {
                const response = await fetch(`/api/products?page=${page}&limit=${limit}`);
                if (!response.ok) throw new Error('Network response was not ok');
                
                const data = await response.json();
                totalPages = data.totalPages;
                const grid = document.getElementById('product-grid');
                const errorDiv = document.getElementById('error-message');
                errorDiv.textContent = '';

                data.products.forEach(product => {
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    card.innerHTML = `
                        <img src="${product.imageData.portraitURL}" alt="${product.info.name}">
                        <h3>${product.info.name}</h3>
                        <p>${product.info.subtitle || ''}</p>
                        <p>${product.price.self.selfUAH.initial20} UAH</p>
                    `;
                    grid.appendChild(card);
                });

                if (currentPage >= totalPages) {
                    document.getElementById('load-more').style.display = 'none';
                }
            } catch (error) {
                console.error('Error loading products:', error);
                document.getElementById('error-message').textContent = 
                    'Ошибка при загрузке товаров. Пожалуйста, попробуйте позже.';
            }
        }

        // Загрузка первой страницы
        loadProducts(currentPage);

        // Обработчик кнопки "Load More"
        document.getElementById('load-more').addEventListener('click', () => {
            currentPage++;
            loadProducts(currentPage);
        });
    </script>
</body>
</html>
